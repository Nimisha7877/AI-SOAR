[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soar"
version = "0.1.0"
description = "ML-driven Security Orchestration, Automation & Response on CICIDS2017"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
    # data pipeline
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pyarrow==17.0.0",          # parquet read/write
    # modelling
    "scikit-learn==1.5.1",
    "lightgbm==4.5.0",
    "shap==0.46.0",             # per-flow explainability for the LLM layer
    # config
    "pydantic==2.8.2",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    # inference service
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "httpx==0.27.2",            # n8n webhook client + API tests
    # reporting
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "ruff==0.6.2",
    "mypy==1.11.1",
    "jupyterlab==4.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true